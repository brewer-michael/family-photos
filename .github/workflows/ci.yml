name: CI

# Pushes run CI on main and on version tags only: other branches are tested through their pull
# request, so its checks don't run twice. Any branch can still be run by hand (workflow_dispatch).
#
# The Docker image is built and smoke-tested here too, and published from here only: by the publish
# job, after every other job passed (checks, unit, e2e, media parity, smoke test), and it pushes the
# very image the smoke test ran, never a rebuild. Pull requests never publish.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only, except for the publish job, which never runs for pull requests.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/brewer-michael/family-photos

jobs:
  # The Unraid template is downloaded straight from main, and the shell scripts run in the image
  # (docker/) or in CI (scripts/ci-*.sh), so a broken edit must fail here first.
  lint:
    name: Unraid template and shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install xmllint and ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils shellcheck

      - name: The Unraid template is well-formed XML
        run: xmllint --noout unraid/family-photos.xml

      # sh is dash on Ubuntu and in the image, so this also catches anything that isn't POSIX sh.
      - name: The shell scripts parse and pass ShellCheck
        run: |
          for f in docker/*.sh scripts/ci-*.sh; do sh -n "$f"; done
          shellcheck docker/*.sh scripts/ci-*.sh

  test:
    name: Check, unit and e2e tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 22: the oldest supported (package.json engines); 24: what the Docker image runs.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Ubuntu's libheif 1.17 ships heif-convert instead of heif-dec; the app detects either.
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libimage-exiftool-perl unzip \
            libheif-examples libheif-plugin-libde265 libheif-plugin-dav1d libheif-plugin-ffmpegdec libheif-plugin-x265

      # Like the Dockerfile: better-sqlite3's own prebuilt binary, not a local compile (npm 11 would
      # run node-gyp for it), so `prepare` (svelte-kit sync) runs as a step of its own.
      - run: npm ci --ignore-scripts
      - run: npm run prepare
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-node${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  media-parity:
    name: Media tests (production toolchain)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The Docker image's base and media packages (docker/media-tools.sh): ffmpeg 7.1, libheif 1.19
    # with heif-dec, exiftool 13. Tests that skip locally on ffmpeg 6.1 run here.
    container: node:24-trixie-slim
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Plus the x265 encoder plugin, which the tests use to build a very large HEIC with heif-enc.
      - name: Install the image's media tools
        run: sh docker/media-tools.sh install libheif-plugin-x265

      - name: Check the media tools like the image build does
        run: sh docker/media-tools.sh check

      # No Python or compiler in this image; see the test job.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prepare
      - run: npm run test:media

  image:
    name: Docker image (build and smoke-test)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # latest = the default branch only (latest=false stops version tags from moving it too);
      # 1.2.3 and 1.2 for v1.2.3 tags; sha-abc1234 for every push. The labels go into the image
      # here, so the publish job can push it exactly as it was tested.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: family-photos:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: sh scripts/ci-docker-smoke.sh family-photos:smoke

      # The tested image itself, for the publish job (kept for a day).
      - name: Save the tested image
        if: github.event_name != 'pull_request'
        run: docker save family-photos:smoke | gzip -1 >"$RUNNER_TEMP/image.tar.gz"

      - name: Hand it to the publish job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: ${{ runner.temp }}/image.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish the tested image
    # `latest` is what Auto Update installs on family servers overnight: nothing is published
    # unless every test passed, media parity (the production toolchain) included.
    needs: [lint, test, media-parity, image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Load the tested image
        run: gunzip -c "$RUNNER_TEMP/image.tar.gz" | docker load

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push it under its tags
        env:
          TAGS: ${{ needs.image.outputs.tags }}
        run: |
          set -eu
          for tag in $TAGS; do
            docker tag family-photos:smoke "$tag"
            docker push "$tag"
          done
