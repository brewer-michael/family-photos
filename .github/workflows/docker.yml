name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  # Pull requests build and smoke-test the image but never push it.
  pull_request:
  workflow_dispatch:

# Read-only, except for the push job, which never runs for pull requests.
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/brewer-michael/family-photos

jobs:
  image:
    name: Build and smoke-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      node-image: ${{ steps.base.outputs.node-image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # The push job rebuilds from this build's cache; pinning the base image's digest for both
      # builds makes every layer a cache hit, so what gets pushed is the image tested here.
      - name: Pin the base image
        id: base
        run: |
          image=$(sed -n 's/^ARG NODE_IMAGE=//p' Dockerfile)
          digest=$(docker buildx imagetools inspect "$image" | awk '$1 == "Digest:" { print $2; exit }')
          case $digest in
          sha256:*) echo "node-image=$image@$digest" >>"$GITHUB_OUTPUT" ;;
          *) echo "Could not read the digest of $image" >&2; exit 1 ;;
          esac

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: NODE_IMAGE=${{ steps.base.outputs.node-image }}
          load: true
          tags: family-photos:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: sh scripts/ci-docker-smoke.sh family-photos:smoke

  push:
    name: Push
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # latest = the default branch only (latest=false stops version tags from moving it too);
      # 1.2.3 and 1.2 for v1.2.3 tags; sha-abc1234 for every push.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the smoke-tested build, so every layer comes from its cache.
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: NODE_IMAGE=${{ needs.image.outputs.node-image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
